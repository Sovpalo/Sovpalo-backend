services:
  db:
    image: postgres:16
    container_name: sovpalo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sovpalo}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sovpalo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: sovpalo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  migrate:
    build: .
    container_name: sovpalo-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sovpalo}
      DB_SSLMODE: disable
    command: ["./migrate", "up"]
    restart: "no"

  api:
    build: .
    container_name: sovpalo-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      APP_PORT: 8000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sovpalo}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      PASSWORD_SALT: ${PASSWORD_SALT:-change_me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
      TELEGRAM_PUBLIC_BASE_URL: ${TELEGRAM_PUBLIC_BASE_URL:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_START_PARAM: ${TELEGRAM_MINI_APP_START_PARAM:-auth}
      TELEGRAM_DEEP_LINK_SCHEME: ${TELEGRAM_DEEP_LINK_SCHEME:-sovpalo}
      TELEGRAM_DEEP_LINK_HOST: ${TELEGRAM_DEEP_LINK_HOST:-telegram-auth}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY_PATH: ${APNS_PRIVATE_KEY_PATH:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      APNS_DEBUG: ${APNS_DEBUG:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FORCE_IPV4: ${SMTP_FORCE_IPV4:-true}
      SMTP_TIMEOUT_SEC: ${SMTP_TIMEOUT_SEC:-20}
      SMTP_SKIP_TLS_VERIFY: ${SMTP_SKIP_TLS_VERIFY:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-15}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-yandexgpt/latest}
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads
      - ${APNS_KEY_HOST_PATH:-/opt/sovpalo/secrets/apns.p8}:/run/secrets/apns.p8:ro
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:
